<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' __VITE_API_ORIGIN__ __VITE_ML_API_ORIGIN__ ws://localhost:5173 http://localhost:5001 http://localhost:8000"
    />
    <meta name="referrer" content="no-referrer" />
    <title>FocusFlow — Premium Productivity Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; }
      body { background: #09090b; overflow-x: hidden; }

      /* ── FocusFlow pre-React loader ──────────────────────────────────────── */
      #focusflow-preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px;
        background: #ffffff;
        color: #111827;
        transition: opacity 0.35s ease-out;
        font-family: 'Syne', system-ui, -apple-system, sans-serif;
      }
      #focusflow-preloader.theme-dark {
        background: #05070d;
        color: #ffffff;
      }
      #focusflow-preloader.ff-hide { opacity: 0; pointer-events: none; }

      .focusflow-loader { display: flex; flex-direction: column; align-items: center; gap: 18px; }

      /* Bouncing focus dot */
      .focusflow-loader-mark {
        height: 34px; display: flex; align-items: flex-end; justify-content: center;
      }
      .focusflow-loader-dot {
        width: 13px; height: 13px; border-radius: 50%;
        background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%);
        animation: ff-bounce 1.2s cubic-bezier(0.45, 0, 0.35, 1) infinite;
        transform-origin: 50% 100%;
      }
      @keyframes ff-bounce {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        12%      { transform: translateY(-2px) scale(0.92, 1.12); }
        42%      { transform: translateY(-26px) scale(1.06, 0.94); }
        58%      { transform: translateY(-26px) scale(1.06, 0.94); }
        88%      { transform: translateY(-2px) scale(0.92, 1.12); }
        94%      { transform: translateY(0) scale(1.28, 0.72); }
      }

      /* Progressing task lines */
      .focusflow-loader-track {
        display: flex; flex-direction: column; align-items: center; gap: 7px;
      }
      .focusflow-loader-track span {
        position: relative; display: block; overflow: hidden;
        height: 4px; border-radius: 999px;
        background: #e6eaf0;
      }
      #focusflow-preloader.theme-dark .focusflow-loader-track span { background: #161c2a; }
      .focusflow-loader-track span::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit;
        background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
        transform: scaleX(0); transform-origin: 0 50%;
        animation: ff-progress 2.4s ease-in-out infinite;
      }
      .focusflow-loader-track span:nth-child(1) { width: 56px; }
      .focusflow-loader-track span:nth-child(1)::after { animation-delay: 0s; }
      .focusflow-loader-track span:nth-child(2) { width: 88px; }
      .focusflow-loader-track span:nth-child(2)::after { animation-delay: 0.25s; }
      .focusflow-loader-track span:nth-child(3) { width: 120px; }
      .focusflow-loader-track span:nth-child(3)::after { animation-delay: 0.5s; }
      @keyframes ff-progress {
        0%   { transform: scaleX(0); opacity: 0.85; }
        45%  { transform: scaleX(1); opacity: 0.95; }
        70%  { transform: scaleX(1); opacity: 0.55; }
        100% { transform: scaleX(0); opacity: 0; transform-origin: 100% 50%; }
      }

      /* Brand + message */
      .focusflow-loader-brand {
        font-weight: 700; font-size: 20px; letter-spacing: -0.02em;
        background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 45%, #8b5cf6 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      .focusflow-loader-message {
        margin-top: -14px;
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
        color: #64748b;
      }
      #focusflow-preloader.theme-dark .focusflow-loader-message { color: #7d8296; }

      /* Reduced motion: calm static indicator */
      @media (prefers-reduced-motion: reduce) {
        #focusflow-preloader { transition: none; }
        .focusflow-loader-dot { animation: none; }
        .focusflow-loader-track span::after {
          animation: none; transform: scaleX(1); opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="focusflow-preloader" role="status" aria-label="FocusFlow is loading">
        <div class="focusflow-loader">
          <div class="focusflow-loader-mark">
            <span class="focusflow-loader-dot"></span>
          </div>
          <div class="focusflow-loader-track">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="focusflow-loader-brand">FocusFlow</div>
        <div class="focusflow-loader-message">Preparing your focus workspace…</div>
      </div>
    </div>
    <script src="/focusflow-preloader.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
