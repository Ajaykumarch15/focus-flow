<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' __VITE_API_ORIGIN__ ws://localhost:5173 http://localhost:5001"
    />
    <meta name="referrer" content="no-referrer" />
    <title>FocusFlow — Premium Productivity Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; }
      body { background: #09090b; overflow-x: hidden; }
      #ff-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #09090b;
        transition: opacity 0.4s ease-out;
      }
      #ff-loader.ff-hide { opacity: 0; pointer-events: none; }
      .ff-loader-ring {
        width: 72px; height: 72px; position: relative; margin-bottom: 20px;
      }
      .ff-loader-ring svg {
        width: 72px; height: 72px; animation: ff-spin 1.4s linear infinite;
      }
      .ff-loader-ring circle {
        fill: none; stroke: #0ea5e9; stroke-width: 3;
        stroke-dasharray: 160; stroke-dashoffset: 60;
        stroke-linecap: round;
      }
      .ff-loader-icon {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 40px; height: 40px; border-radius: 10px; overflow: hidden;
      }
      .ff-loader-icon img { width: 100%; height: 100%; }
      .ff-loader-name {
        font-family: 'Syne', system-ui, sans-serif; font-weight: 700;
        font-size: 20px; letter-spacing: -0.02em;
        background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #0ea5e9 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
      }
      .ff-loader-tagline {
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 12px; color: #52525b; letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ff-loader-dots { display: flex; gap: 4px; margin-top: 20px; }
      .ff-loader-dots span {
        width: 4px; height: 4px; border-radius: 50%; background: #27272a;
        animation: ff-pulse 1.2s ease-in-out infinite;
      }
      .ff-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .ff-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes ff-spin { to { transform: rotate(360deg); } }
      @keyframes ff-pulse {
        0%, 80%, 100% { background: #27272a; transform: scale(1); }
        40% { background: #0ea5e9; transform: scale(1.3); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="ff-loader">
        <div class="ff-loader-ring">
          <svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" /></svg>
          <svg class="ff-loader-icon" viewBox="0 0 100 100">
            <rect x="5" y="5" width="90" height="90" rx="22" fill="#0ea5e9"/>
            <circle cx="50" cy="50" r="28" fill="none" stroke="white" stroke-width="4"/>
            <line x1="50" y1="22" x2="50" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
            <line x1="50" y1="50" x2="68" y2="58" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="ff-loader-name">FocusFlow</div>
        <div class="ff-loader-tagline">Productivity Tracker</div>
        <div class="ff-loader-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
