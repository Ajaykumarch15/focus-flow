# ── FocusFlow nginx config (client container) ────────────────────────────────
# Serves the built SPA and reverse-proxies /api to the API container.
# ${SERVER_UPSTREAM} is substituted at container start by envsubst
# (compose default: "server" → http://server:5001).
#
# TLS: terminate HTTPS in front of this container (Caddy/Traefik/cloud LB) OR
# mount certificates and uncomment the 443 server block below. When TLS is
# terminated here, also set NODE_ENV=production on the server container so the
# session cookie is flagged Secure.

upstream api_upstream {
    server ${SERVER_UPSTREAM}:5001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets are immutable; the HTML shell stays short-lived.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client routing owns non-asset paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

